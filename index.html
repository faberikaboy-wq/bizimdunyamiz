<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Dünyamız ❤️</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #ff6b81;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            height: 100vh;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media(min-width: 481px) {
            .container {
                height: 85vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
        }

        /* Giriş Ekranı */
        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            color: var(--text-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 5px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn.secondary { background: #747d8c; margin-top: 10px; font-size: 0.8rem; padding: 6px;}

        #error-msg { color: #ff4757; margin-top: 10px; font-size: 0.9rem; display: none; }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Sekme İçerikleri */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        .content-area.active {
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            background: white;
            border-top: 1px solid #eee;
            height: 60px;
        }

        nav button {
            flex: 1;
            background: none;
            border: none;
            color: #747d8c;
            cursor: pointer;
            font-weight: 600;
        }

        nav button.active {
            color: var(--primary);
            border-top: 3px solid var(--primary);
        }

        /* Doğum Günü Kutuları */
        .countdown-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .countdown-card {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255,71,87,0.2);
        }

        .countdown-card h3 { font-size: 0.85rem; opacity: 0.9; margin-bottom: 5px;}
        .countdown-card .days { font-size: 1.8rem; font-weight: bold; margin: 5px 0;}
        .countdown-card p { font-size: 0.8rem; opacity: 0.8;}

        /* Durum Takip Paneli */
        .status-tracker {
            background: #fff;
            border: 2px solid #ffe0e6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
        .status-item:last-child { border: none; }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .badge.active-regl { background: #ff4757; color: white; }
        .badge.active-moral { background: #ffa502; color: white; }
        .badge.normal { background: #2ed573; color: white; }

        /* Medoş'un Özel Butonları */
        .partner-controls {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .status-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .status-btn.active-r { border-color: #ff4757; background: #ffe0e6; color: #ff4757; }
        .status-btn.active-m { border-color: #ffa502; background: #fff4e0; color: #ffa502; }

        /* Sabitlenmiş Chat Alanı */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #f1f2f6;
            border-radius: 8px;
            background: #fafafa;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .message.mine { background: #ff4757; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.theirs { background: #e4e6eb; color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 2px; }
        .message .sender-name { font-size: 0.7rem; opacity: 0.8; margin-bottom: 3px; display: block; }

        .chat-input-area { display: flex; gap: 8px; height: 45px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .chat-input-area button { background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Ayarlar */
        .settings-group { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 15px; }
        .settings-group h4 { margin-bottom: 10px; color: var(--primary); }
        .settings-group input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- GİRİŞ EKRANI -->
        <div id="login-screen" class="screen active">
            <h1>❤️ Bizim Dünyamız</h1>
            <p>Devam etmek için şifreni gir</p>
            <div class="login-box">
                <input type="password" id="password-input" placeholder="••••" maxlength="6">
                <button class="btn" onclick="tryLogin()">Giriş Yap</button>
                <div id="error-msg">Geçersiz şifre!</div>
                <button class="btn secondary" onclick="simulateRoleSwitch()">Giriş Modu: <span id="current-sim-role">Hipoş</span> (Değiştir)</button>
            </div>
        </div>

        <!-- ANA UYGULAMA EKRANI -->
        <div id="main-screen" class="screen">
            <header>
                <h2 id="welcome-title">Hoş Geldin ❤️</h2>
                <button class="logout-btn" onclick="logout()">Çıkış</button>
            </header>

            <!-- SEKME 1: ANASAYFA -->
            <div id="tab-home" class="content-area active">
                <!-- DOĞUM GÜNÜ SAYACI -->
                <div class="countdown-container">
                    <div class="countdown-card">
                        <h3 id="label-user-birthday">Doğum Günüme</h3>
                        <div class="days" id="user-birthday-countdown">--</div>
                        <p>Gün Kaldı</p>
                    </div>
                    <div class="countdown-card">
                        <h3 id="label-partner-birthday">Doğum Gününe</h3>
                        <div class="days" id="partner-birthday-countdown">--</div>
                        <p>Gün Kaldı</p>
                    </div>
                </div>

                <!-- DURUM TAKİP PANELİ (HİPOŞ GÖRÜR) -->
                <div id="my-view-panel" class="status-tracker">
                    <h4>Medoş'un Anlık Durumu 👑</h4>
