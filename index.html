<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Dünyamız ❤️</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #ff6b81;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media(min-width: 481px) {
            .container {
                min-height: 85vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }

        /* Ekranlar */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* Giriş Ekranı */
        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
        }

        #login-screen h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        #login-screen p {
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            color: var(--text-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 5px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        .login-box input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #error-msg {
            color: #ff4757;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        /* Ana İçerik Header */
        header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 1.2rem;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Sekmeler (Tabs) */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        .content-area.active {
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            background: white;
            border-top: 1px solid #eee;
        }

        nav button {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 0;
            font-size: 0.85rem;
            color: #747d8c;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        nav button.active {
            color: var(--primary);
            border-top: 3px solid var(--primary);
        }

        /* Sayaç Kutusu */
        .counter-card {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255,71,87,0.3);
        }

        .counter-card h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        #time-together {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Chat Alanı */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            max-height: calc(100vh - 250px);
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            word-break: break-word;
            position: relative;
        }

        .message.mine {
            background: #ff4757;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.theirs {
            background: #f1f2f6;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message .sender-name {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 3px;
            display: block;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Ayarlar & Şifre Değiştirme */
        .settings-group {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eee;
            margin-bottom: 15px;
        }

        .settings-group h4 {
            margin-bottom: 10px;
            color: var(--primary);
        }

        .settings-group input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GİRİŞ EKRANI -->
        <div id="login-screen" class="screen active">
            <h1>❤️ Bizim Dünyamız</h1>
            <p>Devam etmek için şifreni gir</p>
            <div class="login-box">
                <input type="password" id="password-input" placeholder="••••" maxlength="6">
                <button class="btn" onclick="tryLogin()">Giriş Yap</button>
                <div id="error-msg">Geçersiz şifre!</div>
            </div>
        </div>

        <!-- ANA UYGULAMA EKRANI -->
        <div id="main-screen" class="screen">
            <header>
                <h2 id="welcome-title">Hoş Geldin ❤️</h2>
                <button class="logout-btn" onclick="logout()">Çıkış</button>
            </header>

            <!-- SEKME 1: ANASAYFA / SAYAC -->
            <div id="tab-home" class="content-area active">
                <div class="counter-card">
                    <h3>Birlikte Geçen Zamanımız</h3>
                    <div id="time-together">Hesaplanıyor...</div>
                </div>
                <div class="settings-group">
                    <h4>İlişki Yıldönümü</h4>
                    <p style="font-size: 0.9rem; color: #666; margin-bottom: 8px;">Birlikte olduğunuz tarihi seçin:</p>
                    <input type="date" id="anniversary-date" onchange="updateAnniversary()">
                </div>
            </div>

            <!-- SEKME 2: SOHBET -->
            <div id="tab-chat" class="content-area">
                <div class="chat-messages" id="chat-messages">
                    <!-- Mesajlar buraya gelecek -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="message-input" placeholder="Tatlı bir şeyler yaz..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">Gönder</button>
                </div>
            </div>

            <!-- SEKME 3: AYARLAR -->
            <div id="tab-settings" class="content-area">
                <div class="settings-group">
                    <h4>Şifreni Değiştir</h4>
                    <input type="password" id="old-pass" placeholder="Mevcut Şifren">
                    <input type="password" id="new-pass" placeholder="Yeni Şifren">
                    <button class="btn" onclick="changePassword()">Şifreyi Güncelle</button>
                    <p id="pass-msg" style="font-size: 0.85rem; margin-top: 8px; color: green; display: none;"></p>
                </div>
            </div>

            <!-- ALT NAVİGASYON -->
            <nav>
                <button class="active" onclick="switchTab('home', this)">Ana Sayfa</button>
                <button onclick="switchTab('chat', this)">Sohbet</button>
                <button onclick="switchTab('settings', this)">Ayarlar</button>
            </nav>
        </div>
    </div>

    <script>
        // Varsayılan Şifreler ve İsimler (İstediğin gibi değiştirebilirsin)
        // Kullanıcı 1 (Sen): Şifre "1453"
        // Kullanıcı 2 (Sevgilin): Şifre "1903"
        let users = JSON.parse(localStorage.getItem('couple_users')) || {
            user1: { name: "Sen", pass: "1453" },
            user2: { name: "Sevgilin", pass: "1903" }
        };

        let currentUser = null;

        // Şifre Giriş Kontrolü
        function tryLogin() {
            const inputVal = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (inputVal === users.user1.pass) {
                currentUser = 'user1';
            } else if (inputVal === users.user2.pass) {
                currentUser = 'user2';
            } else {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            document.getElementById('password-input').value = '';
            
            // Giriş başarılı, ana ekrana geç
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('main-screen').classList.add('active');
            
            document.getElementById('welcome-titleinnerText').innerText = `Hoş Geldin, ${users[currentUser].name} ❤️`;
            
            loadAppData();
        }

        function logout() {
            currentUser = null;
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('login-screen').classList.add('active');
        }

        // Sekme Değiştirme
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.content-area').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            btnElement.classList.add('active');
        }

        // Sayaç ve Tarih İşlemleri
        let anniversary = localStorage.getItem('couple_anniversary') || '2023-01-01';
        document.getElementById('anniversary-date').value = anniversary;

        function updateAnniversary() {
            anniversary = document.getElementById('anniversary-date').value;
            localStorage.setItem('couple_anniversary', anniversary);
        }

        function calculateTimeTogether() {
            const start = new Date(anniversary);
            const now = new Date();
            const diff = now - start;

            if (diff < 0) {
                document.getElementById('time-together').innerText = "Gelecekten mi geldiniz? Tarihi kontrol edin 😊";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('time-together').innerText = `${days} Gün ${hours} Saat ${minutes} Dakika ${seconds} Saniye`;
        }
        setInterval(calculateTimeTogether, 1000);

        // Sohbet Sistemi
        let messages = JSON.parse(localStorage.getItem('couple_messages')) || [];

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:20px;">Henüz mesaj yok. İlk mesajı sen gönder! ✨</p>';
                return;
            }

            messages.forEach(msg => {
                const div = document.createElement('div');
                const isMine = msg.sender === currentUser;
                div.className = `message ${isMine ? 'mine' : 'theirs'}`;
                
                div.innerHTML = `
                    <span class="sender-name">${users[msg.sender].name}</span>
                    ${msg.text}
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            messages.push({
                sender: currentUser,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            localStorage.setItem('couple_messages', JSON.stringify(messages));
            input.value = '';
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Şifre Değiştirme
        function changePassword() {
            const oldPass = document.getElementById('old-pass').value.trim();
            const newPass = document.getElementById('new-pass').value.trim();
            const msgEl = document.getElementById('pass-msg');

            if (oldPass !== users[currentUser].pass) {
                msgEl.style.color = 'red';
                msgEl.innerText = "Mevcut şifrenizi yanlış girdiniz!";
                msgEl.style.display = 'block';
                return;
            }

            if (!newPass || newPass.length < 3) {
                msgEl.style.color = 'red';
                msgEl.innerText = "Yeni şifre en az 3 karakter olmalıdır!";
                msgEl.style.display = 'block';
                return;
            }

            users[currentUser].pass = newPass;
            localStorage.setItem('couple_users', JSON.stringify(users));

            msgEl.style.color = 'green';
            msgEl.innerText = "Şifreniz başarıyla değiştirildi! 🎉";
            msgEl.style.display = 'block';

            document.getElementById('old-pass').value = '';
            document.getElementById('new-pass').value = '';
        }

        function loadAppData() {
            calculateTimeTogether();
            renderMessages();
        }
    </script>
</body>
</html>
