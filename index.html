<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Dünyamız ❤️</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #ff6b81;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media(min-width: 481px) {
            .container {
                min-height: 85vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }

        /* Ekranlar */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* Giriş Ekranı */
        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
        }

        #login-screen h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        #login-screen p {
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            color: var(--text-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 5px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        .login-box input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn.secondary {
            background: #747d8c;
            margin-top: 10px;
            font-size: 0.8rem;
            padding: 8px;
        }

        #error-msg {
            color: #ff4757;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        /* Ana İçerik Header */
        header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 1.2rem;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Sekmeler (Tabs) */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        .content-area.active {
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            background: white;
            border-top: 1px solid #eee;
        }

        nav button {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 0;
            font-size: 0.85rem;
            color: #747d8c;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        nav button.active {
            color: var(--primary);
            border-top: 3px solid var(--primary);
        }

        /* Doğum Günü Sayacı Kartları */
        .birthday-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .birthday-card {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255,71,87,0.2);
        }

        .birthday-card h3 {
            font-size: 0.85rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .birthday-card .days {
            font-size: 1.7rem;
            font-weight: bold;
        }

        /* Durum İzleme Kartı (Hipoş İçin) */
        .status-card {
            background: #fff;
            border: 2px solid #ffe0e6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .status-card h4 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
        .status-line:last-child { border: none; }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge.normal { background: #2ed573; color: white; }
        .badge.regl { background: #ff4757; color: white; }
        .badge.moral { background: #ffa502; color: white; }

        /* Durum Değiştirme Paneli (Medoş İçin) */
        .control-card {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .control-card h4 {
            margin-bottom: 10px;
        }

        .toggle-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-btn.on-regl { border-color: #ff4757; background: #ffe0e6; color: #ff4757; }
        .toggle-btn.on-moral { border-color: #ffa502; background: #fff4e0; color: #ffa502; }

        /* Chat Alanı */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            max-height: calc(100vh - 250px);
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            word-break: break-word;
            position: relative;
        }

        .message.mine {
            background: #ff4757;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.theirs {
            background: #f1f2f6;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message .sender-name {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 3px;
            display: block;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Ayarlar & Şifre Değiştirme */
        .settings-group {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eee;
            margin-bottom: 15px;
        }

        .settings-group h4 {
            margin-bottom: 10px;
            color: var(--primary);
        }

        .settings-group input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GİRİŞ EKRANI -->
        <div id="login-screen" class="screen active">
            <h1>❤️ Bizim Dünyamız</h1>
            <p>Devam etmek için şifreni gir</p>
            <div class="login-box">
                <input type="password" id="password-input" placeholder="••••" maxlength="6">
                <button class="btn" onclick="tryLogin()">Giriş Yap</button>
                <div id="error-msg">Geçersiz şifre!</div>
